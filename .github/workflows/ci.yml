name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          PUBLIC_NOINDEX: "false"

      - name: Validate content, routes, and private data
        run: pnpm validate

      - name: Smoke test critical routes
        run: pnpm smoke

      - name: Enforce performance budgets
        run: pnpm budget

      - name: Install Chromium for visual smoke
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual smoke (overflow, slider, forms, language, 404)
        run: pnpm smoke:visual

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
